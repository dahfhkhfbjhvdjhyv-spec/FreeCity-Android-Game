name: AppMarket Android builds

on:
  push:
    branches: [appmarket-ecosystem]
    paths:
      - 'apps/controller/**'
      - 'apps/guardian/**'
      - '.github/workflows/appmarket-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [controller, guardian]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AppMarket-${{ matrix.app }}-debug
          path: apps/${{ matrix.app }}/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
