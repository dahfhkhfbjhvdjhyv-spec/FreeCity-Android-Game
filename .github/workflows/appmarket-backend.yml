name: AppMarket backend checks

on:
  push:
    branches: [appmarket-ecosystem]
    paths:
      - 'backend/**'
      - '.github/workflows/appmarket-backend.yml'
  pull_request:
    branches: [appmarket-ecosystem]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Compile Python source
        run: python -m compileall -q backend/app
