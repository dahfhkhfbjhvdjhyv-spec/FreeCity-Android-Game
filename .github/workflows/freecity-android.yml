name: FreeCity Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build FreeCity for Android
    runs-on: ubuntu-latest
    steps:
      - name: Validate Unity credentials
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        shell: bash
        run: |
          missing=0
          for key in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing repository Actions secret: $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add all three secrets under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build Android APK with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 2022.3.50f1
          targetPlatform: Android
          buildMethod: FreeCity.Editor.FreeCityAndroidBuild.Build
          androidAppBundle: false

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FreeCity-Android-APK
          path: Build/FreeCity.apk
          if-no-files-found: error
