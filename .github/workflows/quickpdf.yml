name: QuickPDF Android APK
on:
  push:
    branches: [app-business]
    paths:
      - 'products/quickpdf/**'
      - '.github/workflows/quickpdf.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products/quickpdf
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuickPDF-debug-apk
          path: products/quickpdf/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
